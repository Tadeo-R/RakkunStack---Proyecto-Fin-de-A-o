<VirtualHost *:80>
	DocumentRoot /var/www/competti/Comppeti/html

	<Directory /var/www/competti/Comppeti/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>